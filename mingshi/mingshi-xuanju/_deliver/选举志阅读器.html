<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>明史·选举志 知识图谱阅读器</title>
<style>
  :root{
    --bg:#f5f6f8; --panel:#ffffff; --ink:#1f2329; --sub:#6b7280; --line:#e5e7eb;
    --brand:#9a2e2e; --brand2:#b5453b; --chip:#eef2f7; --chipink:#274690;
    --hl:#fff3cd; --ok:#1a7f37;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:"PingFang SC","Microsoft YaHei",-apple-system,Segoe UI,sans-serif;
       background:var(--bg);color:var(--ink);font-size:14px;line-height:1.6}
  header{background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff;
         padding:14px 22px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
  header h1{margin:0;font-size:18px;font-weight:700;letter-spacing:1px}
  header .stats{display:flex;gap:14px;margin-left:auto;flex-wrap:wrap}
  header .stat{background:rgba(255,255,255,.15);border-radius:8px;padding:4px 12px;text-align:center}
  header .stat b{display:block;font-size:17px}
  header .stat span{font-size:11px;opacity:.85}
  .wrap{display:flex;min-height:calc(100vh - 60px)}
  aside{width:248px;background:var(--panel);border-right:1px solid var(--line);
        padding:14px;overflow:auto;position:sticky;top:0;height:calc(100vh - 60px)}
  aside h3{margin:14px 0 6px;font-size:12px;color:var(--sub);text-transform:uppercase;letter-spacing:1px}
  .tabs{display:flex;flex-wrap:wrap;gap:6px}
  .tab{cursor:pointer;border:1px solid var(--line);background:#fff;border-radius:6px;
       padding:5px 9px;font-size:12px;color:var(--ink)}
  .tab.active{background:var(--brand);color:#fff;border-color:var(--brand)}
  .layerlist .tab{display:flex;justify-content:space-between;width:100%}
  .layerlist .tab small{color:var(--sub)}
  .layerlist .tab.active small{color:#ffe}
  .search{width:100%;padding:7px 9px;border:1px solid var(--line);border-radius:6px;margin-top:6px;font-size:13px}
  main{flex:1;padding:18px 24px;overflow:auto;height:calc(100vh - 60px)}
  .crumb{color:var(--sub);font-size:13px;margin-bottom:10px}
  .crumb a{color:var(--chipink);cursor:pointer}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:10px;
        padding:14px 16px;margin-bottom:12px;box-shadow:0 1px 2px rgba(0,0,0,.03)}
  .card h4{margin:0 0 6px;font-size:15px;color:var(--brand)}
  .item-row{display:flex;align-items:center;gap:10px;padding:9px 12px;border:1px solid var(--line);
            border-radius:8px;margin-bottom:8px;cursor:pointer;background:#fff}
  .item-row:hover{border-color:var(--brand);background:#fcf6f6}
  .item-row .iid{font-weight:700;color:var(--brand);min-width:62px}
  .item-row .vol{color:var(--sub);font-size:12px}
  .item-row .lc{margin-left:auto;background:var(--chip);color:var(--chipink);
                border-radius:20px;padding:2px 10px;font-size:12px}
  .badges{display:flex;flex-wrap:wrap;gap:4px}
  .badge{font-size:11px;background:var(--chip);color:var(--chipink);border-radius:4px;padding:1px 7px}
  .kv{display:grid;grid-template-columns:96px 1fr;gap:4px 10px;margin-top:8px}
  .kv .k{color:var(--sub);font-size:12px}
  .kv .v{font-size:13px;word-break:break-word}
  .chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
  .chip{background:var(--chip);color:var(--chipink);border-radius:14px;padding:2px 10px;
        font-size:12px;cursor:pointer;border:1px solid transparent}
  .chip:hover{border-color:var(--chipink)}
  .chip.ent{background:#eaf3ff;color:#1a56a8}
  .chip.tme{background:#fdeef3;color:#a3405b}
  .chip.evt{background:#fff1e6;color:#b5651d}
  .sec-title{font-size:13px;color:var(--sub);margin:14px 0 6px;font-weight:700;
             border-left:3px solid var(--brand);padding-left:8px}
  .qa{border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:10px;background:#fff}
  .qa .q{font-weight:700;color:var(--ink);cursor:pointer}
  .qa .q:hover{color:var(--brand)}
  .qa .a{color:var(--sub);font-size:13px;margin-top:6px}
  .qa .go{display:inline-block;margin-top:8px;font-size:12px;color:var(--brand);cursor:pointer}
  .src{font-size:11px;color:var(--sub);margin-top:6px}
  .empty{color:var(--sub);padding:30px;text-align:center}
  footer{text-align:center;color:var(--sub);font-size:12px;padding:10px}
  mark{background:var(--hl);padding:0 2px;border-radius:3px}
</style>
</head>

alias": ["南监"], "src_loc": "卷45-L06", "confidence": 0.95, "evidence": "十八年迁都，乃以京师国子监为南京国子监，而太学生有南北监之分。", "id": "ENT-22503", "_layer": "ents"}, "ENT-22504": {"key": "ent:taizu", "vol": 45, "item_id": "45-002", "slot": 1, "name": "明太祖", "ent_type": "人物", "alias": ["朱元璋", "洪武帝"], "src_loc": "卷45-L04", "confidence": 0.98, "evidence": "明太祖与刘基所定科举试士之法。", "id": "ENT-22504", "_layer": "ents"}, "ENT-22505": {"key": "ent:chengzu", "vol": 45, "item_id": "45-002", "slot": 2, "name": "明成祖", "ent_type": "人物", "alias": ["永乐帝", "朱棣"], "src_loc": "卷45-L06", "confidence": 0.98, "evidence": "永乐二年，既授一甲三人……庶吉士遂专属翰林矣。", "id": "ENT-22505", "_layer": "ents"}, "ENT-23001": {"key": "ent:libu", "vol": 46, "item_id": "46-001", "slot": 1, "name": "礼部", "ent_type": "机构", "alias": [], "src_loc": "卷46-L26", "confidence": 0.97, "evidence": "会试，于礼部；礼部官监试二人。", "id": "ENT-23001", "_layer": "ents"}, "ENT-23002": {"key": "ent:bingbu", "vol": 46, "item_id": "46-001", "slot": 2, "name": "兵部", "ent_type": "机构", "alias": [], "src_loc": "卷46-L38", "confidence": 0.97, "evidence": "中式者，兵部同总兵官于帅府试策略，教场试弓马。", "id": "ENT-23002", "_layer": "ents"}, "ENT-23003": {"key": "ent:hanlin", "vol": 46, "item_id": "46-002", "slot": 1, "name": "翰林院", "ent_type": "机构", "alias": [], "src_loc": "卷46-L26", "confidence": 0.97, "evidence": "廷试用翰林及朝臣文学之优者，为读卷官；庶吉士遂专属翰林。", "id": "ENT-23003", "_layer": "ents"}, "ENT-23004": {"key": "ent:gongyuan", "vol": 46, "item_id": "46-003", "slot": 1, "name": "贡院", "ent_type": "考场", "alias": [], "src_loc": "卷46-L26", "confidence": 0.96, "evidence": "试士之所，谓之贡院；诸生席舍，谓之号房。", "id": "ENT-23004", "_layer": "ents"}, "ENT-23005": {"key": "ent:liusanwu", "vol": 46, "item_id": "46-004", "slot": 1, "name": "刘三吾", "ent_type": "人物", "alias": [], "src_loc": "卷46-L29", "confidence": 0.97, "evidence": "洪武丁丑，考官刘三吾、白信蹈所取宋琮等五十二人，皆南士。", "id": "ENT-23005", "_layer": "ents"}, "ENT-23006": {"key": "ent:baixindao", "vol": 46, "item_id": "46-004", "slot": 2, "name": "白信蹈", "ent_type": "人物", "alias": [], "src_loc": "卷46-L29", "confidence": 0.96, "evidence": "帝犹怒不已，悉诛信蹈及信、安阝等，戍三吾于边。", "id": "ENT-23006", "_layer": "ents"}, "ENT-23007": {"key": "ent:yangshiqi", "vol": 46, "item_id": "46-005", "slot": 1, "name": "杨士奇", "ent_type": "人物", "alias": [], "src_loc": "卷46-L29", "confidence": 0.96, "evidence": "洪熙元年，仁宗命杨士奇等定取士之额，南人十六，北人十四。", "id": "ENT-23007", "_layer": "ents"}, "ENT-23008": {"key": "ent:zhangcong", "vol": 46, "item_id": "46-005", "slot": 2, "name": "张璁", "ent_type": "人物", "alias": ["张孚敬"], "src_loc": "卷46-L30", "confidence": 0.95, "evidence": "嘉靖七年，用兵部侍郎张璁言，各省主试皆遣京官或进士。", "id": "ENT-23008", "_layer": "ents"}, "ENT-23009": {"key": "ent:xupu", "vol": 46, "item_id": "46-006", "slot": 1, "name": "徐溥", "ent_type": "人物", "alias": [], "src_loc": "卷46-L33", "confidence": 0.95, "evidence": "大学士徐溥言：自永乐二年以来……请自今以后，立为定制，一次开科，一次选用。", "id": "ENT-23009", "_layer": "ents"}, "ENT-23010": {"key": "ent:xieduo", "vol": 46, "item_id": "46-006", "slot": 2, "name": "谢铎", "ent_type": "人物", "alias": [], "src_loc": "卷46-L30", "confidence": 0.95, "evidence": "掌国子监谢铎言：考官皆御史方面所辟召……科举之法坏矣。", "id": "ENT-23010", "_layer": "ents"}, "ENT-23011": {"key": "ent:shanglu", "vol": 46, "item_id": "46-007", "slot": 1, "name": "商辂", "ent_type": "人物", "alias": [], "src_loc": "卷46-L37", "confidence": 0.97, "evidence": "十年乙丑，会试、廷试第一皆商辂……三试皆第一，士子艳称为三元，明代惟辂一人而已。", "id": "ENT-23011", "_layer": "ents"}, "ENT-23012": {"key": "ent:wanglaipin", "vol": 46, "item_id": "46-007", "slot": 2, "name": "王来聘", "ent_type": "人物", "alias": [], "src_loc": "卷46-L38", "confidence": 0.96, "evidence": "乃赐王来聘等及第、出身有差。武举殿试自此始也。", "id": "ENT-23012", "_layer": "ents"}, "ENT-23013": {"key": "ent:wubozong", "vol": 46, "item_id": "46-008", "slot": 1, "name": "吴伯宗", "ent_type": "人物", "alias": [], "src_loc": "卷46-L27", "confidence": 0.96, "evidence": "帝亲制策问，试于奉天殿，擢吴伯宗第一。", "id": "ENT-23013", "_layer": "ents"}, "ENT-23501": {"key": "ent:liuke", "vol": 47, "item_id": "47-001", "slot": 1, "name": "六科", "ent_type": "机构", "alias": ["科道"], "src_loc": "卷47-L47", "confidence": 0.96, "evidence": "给事中、御史谓之科道；科五十员，道百二十员。", "id": "ENT-23501", "_layer": "ents"}, "ENT-23502": {"key": "ent:ducha", "vol": 47, "item_id": "47-001", "slot": 2, "name": "都察院", "ent_type": "机构", "alias": [], "src_loc": "卷47-L47", "confidence": 0.95, "evidence": "御史必试职一年始实授。", "id": "ENT-23502", "_layer": "ents"}, "ENT-23503": {"key": "ent:neige", "vol": 47, "item_id": "47-002", "slot": 1, "name": "内阁", "ent_type": "机构", "alias": [], "src_loc": "卷47-L46", "confidence": 0.95, "evidence": "非翰林不入内阁；阁臣典试，翰、詹一人副之。", "id": "ENT-23503", "_layer": "ents"}, "ENT-23504": {"key": "ent:songlian", "vol": 47, "item_id": "47-003", "slot": 1, "name": "宋濂", "ent_type": "人物", "alias": [], "src_loc": "卷47-L44", "confidence": 0.95, "evidence": "克处州，征耆儒宋濂、刘基、章溢、叶琛至建康，以濂为江南等处儒学提举。", "id": "ENT-23504", "_layer": "ents"}, "ENT-23505": {"key": "ent:gaogong", "vol": 47, "item_id": "47-004", "slot": 1, "name": "高拱", "ent_type": "人物", "alias": [], "src_loc": "卷47-L46", "confidence": 0.94, "evidence": "隆庆中，大学士高拱言：国初，举人跻八座为名臣者甚众……请自授官以后，惟考政绩，不问其出身。", "id": "ENT-23505", "_layer": "ents"}, "ENT-23506": {"key": "ent:sunpiyang", "vol": 47, "item_id": "47-004", "slot": 2, "name": "孙丕扬", "ent_type": "人物", "alias": [], "src_loc": "卷47-L46", "confidence": 0.94, "evidence": "尚书李戴拟行报可，孙丕扬踵而行之（掣签法）。", "id": "ENT-23506", "_layer": "ents"}, "ENT-23507": {"key": "ent:kuangzhong", "vol": 47, "item_id": "47-005", "slot": 1, "name": "况钟", "ent_type": "人物", "alias": [], "src_loc": "卷47-L48", "confidence": 0.93, "evidence": "宣德三年，况钟、赵豫等以荐擢守苏、松诸府，赐敕行事。", "id": "ENT-23507", "_layer": "ents"}, "ENT-23508": {"key": "ent:huotao", "vol": 47, "item_id": "47-005", "slot": 2, "name": "霍韬", "ent_type": "人物", "alias": [], "src_loc": "卷47-L55", "confidence": 0.93, "evidence": "嘉靖中，詹事霍韬言：成化中，增太祖时军职四倍，今又增几倍矣。", "id": "ENT-23508", "_layer": "ents"}, "RULE-22501": {"key": "rule:keju-bixu-xuexiao", "vol": 45, "item_id": "45-003", "slot": 1, "type": "定制", "text": "科举必由学校，而学校起家，可不由科举。", "src_loc": "卷45-L05", "confidence": 0.97, "evidence": "科举必由学校，而学校起家，可不由科举。", "id": "RULE-22501", "_layer": "rules"}, "RULE-22502": {"key": "rule:keju-sheng", "vol": 45, "item_id": "45-003", "slot": 2, "type": "定制", "text": "科目为盛，卿相皆由此出，学校则储才以应科目者也。", "src_loc": "卷45-L04", "confidence": 0.96, "evidence": "明制，科目为盛，卿相皆由此出，学校则储才以应科目者也。", "id": "RULE-22502", "_layer": "rules"}, "RULE-22503": {"key": "rule:shengyuan-yijing", "vol": 45, "item_id": "45-003", "slot": 3, "type": "凡", "text": "生员专治一经，以礼、乐、射、御、书、数设科分教。", "src_loc": "卷45-L16", "confidence": 0.94, "evidence": "生员专治一经，以礼、乐、射、御、书、数设科分教，务求实才。", "id": "RULE-22503", "_layer": "rules"}, "RULE-22504": {"key": "rule:jiaoguan-keke", "vol": 45, "item_id": "45-003", "slot": 4, "type": "著为令", "text": "学官考课法，专以科举为殿最。", "src_loc": "卷45-L16", "confidence": 0.94, "evidence": "二十六年，定学官考课法，专以科举为殿最。", "id": "RULE-22504", "_layer": "rules"}, "RULE-22505": {"key": "rule:suigong-ding'e", "vol": 45, "item_id": "45-003", "slot": 5, "type": "定制", "text": "岁贡之例：府学岁二人，州学二岁三人，县学岁一人，弘治、嘉靖间遂为永制。", "src_loc": "卷45-L12", "confidence": 0.94, "evidence": "弘治、嘉靖间，仍定府学岁二人，州学二岁三人，县学岁一人，遂为永制。", "id": "RULE-22505", "_layer": "rules"}, "RULE-23001": {"key": "rule:fei-keju-wu-guan", "vol": 46, "item_id": "46-009", "slot": 1, "type": "著为令", "text": "使中外文臣皆由科举而进，非科举者毋得与官。", "src_loc": "卷46-L27", "confidence": 0.96, "evidence": "使中外文臣皆由科举而进，非科举者毋得与官。", "id": "RULE-23001", "_layer": "rules"}, "RULE-23002": {"key": "rule:kechang-huibi", "vol": 46, "item_id": "46-009", "slot": 2, "type": "禁", "text": "试日入场，讲问、代冒者有禁；文字中回避御名、庙号，及不许自序门第。", "src_loc": "卷46-L26", "confidence": 0.95, "evidence": "试日入场，讲问、代冒者有禁……不许自序门第。", "id": "RULE-23002", "_layer": "rules"}, "RULE-23003": {"key": "rule:mifeng-sanhe", "vol": 46, "item_id": "46-009", "slot": 3, "type": "例", "text": "弥封编号作三合字。", "src_loc": "卷46-L26", "confidence": 0.95, "evidence": "弥封编号作三合字。", "id": "RULE-23003", "_layer": "rules"}, "RULE-23501": {"key": "rule:santu-bingyong", "vol": 47, "item_id": "47-006", "slot": 1, "type": "例", "text": "进士为一途，举贡等为一途，吏员等为一途，所谓三途并用也。", "src_loc": "卷47-L46", "confidence": 0.96, "evidence": "进士为一途，举贡等为一途，吏员等为一途，所谓三途并用也。", "id": "RULE-23501", "_layer": "rules"}, "RULE-23502": {"key": "rule:jingcha-liunian", "vol": 47, "item_id": "47-006", "slot": 2, "type": "著为令", "text": "京官六年一察，谓之京察；外官三年一朝觐，察典随之，谓之外察（大计）。", "src_loc": "卷47-L54", "confidence": 0.95, "evidence": "考察之法，京官六年……谓之京察；外官三年一朝觐……谓之外察。", "id": "RULE-23502", "_layer": "rules"}, "RULE-23503": {"key": "rule:tingxuan-chufu", "vol": 47, "item_id": "47-006", "slot": 3, "type": "凡", "text": "初授者曰听选，升任者曰升迁。", "src_loc": "卷47-L46", "confidence": 0.94, "evidence": "初授者曰听选，升任者曰升迁。", "id": "RULE-23503", "_layer": "rules"}, "RULE-23504": {"key": "rule:nanbei-gengdiao", "vol": 47, "item_id": "47-006", "slot": 4, "type": "定制", "text": "洪武间，定南北更调之制，南人官北，北人官南。", "src_loc": "卷47-L46", "confidence": 0.94, "evidence": "洪武间，定南北更调之制，南人官北，北人官南。", "id": "RULE-23504", "_layer": "rules"}, "RULE-23505": {"key": "rule:wuzhi-shixi", "vol": 47, "item_id": "47-006", "slot": 5, "type": "定制", "text": "武官爵，嫡子袭替，长幼次及之；绝者旁支继。", "src_loc": "卷47-L56", "confidence": 0.93, "evidence": "明初定例，嫡子袭替，长幼次及之；绝者，嫡子庶子孙次及之；又绝者，以弟继。", "id": "RULE-23505", "_layer": "rules"}, "REG-22501": {"key": "reg:jiansheng-sise", "vol": 45, "item_id": "45-010", "slot": 1, "name": "监生四色（举贡荫例）", "selection_type": "学校", "category": "学校制", "status": "定制", "school_type": "国学", "evolution": "入国学者通谓之监生；举人曰举监，生员曰贡监，品官子弟曰荫监，捐赀曰例监。", "agencies": [{"text": "国子监", "ent_keys": ["ent:guozijian"], "ent_ids": ["ENT-22501"]}], "targets": ["监生"], "ent_keys": ["ent:guozijian"], "src_loc": "卷45-L05", "confidence": 0.96, "evidence": "举人曰举监，生员曰贡监，品官子弟曰荫监，捐赀曰例监。", "id": "REG-22501", "ent_ids": ["ENT-22501"], "_layer": "regs"}, "REG-22502": {"key": "reg:gongju", "vol": 45, "item_id": "45-011", "slot": 1, "name": "贡举（岁贡/选贡/恩贡/纳贡）", "selection_type": "贡举", "category": "学校制", "status": "定制", "school_type": "国学", "evolution": "岁贡始由生员选择，后命各学岁贡一人；弘治中行选贡；恩贡以庆典充之；纳贡视例监。", "agencies": [{"text": "国子监", "ent_keys": ["ent:guozijian"], "ent_ids": ["ENT-22501"]}], "targets": ["生员", "贡生"], "tme_keys": ["tme:hzd-yigong", "tme:zhengtong-suigong", "tme:jingtai-lijian"], "opn_keys": ["opn:zhangmao-xuangong", "opn:guorusin-tingxuan"], "ent_keys": ["ent:guozijian"], "src_loc": "卷45-L12", "confidence": 0.95, "evidence": "岁贡之始，必考学行端庄、文理优长者以充之……选贡多英才……恩贡者，国家有庆典或登极诏书，以当贡者充之。", "id": "REG-22502", "tme_ids": ["TME-22502", "TME-22503", "TME-22504"], "opn_ids": ["OPN-22501", "OPN-22502"], "ent_ids": ["ENT-22501"], "_layer": "regs"}, "REG-22503": {"key": "reg:yinjian", "vol": 45, "item_id": "45-012", "slot": 1, "name": "荫监（官生/恩生）", "selection_type": "学校", "category": "学校制", "status": "定制", "school_type": "国学", "evolution": "文官一品至七品皆得荫一子；后限在京三品以上曰官生；特恩不限官品曰恩生。", "agencies": [{"text": "国子监", "ent_keys": ["ent:guozijian"], "ent_ids": ["ENT-22501"]}], "targets": ["官员子弟"], "ent_keys": ["ent:guozijian"], "src_loc": "卷45-L13", "confidence": 0.94, "evidence": "荫子入监，明初因前代任子之制……在京三品以上方得请荫，谓之官生；出自特恩者，不限官品，谓之恩生。", "id": "REG-22503", "ent_ids": ["ENT-22501"], "_layer": "regs"}, "REG-22504": {"key": "reg:jifen", "vol": 45, "item_id": "45-013", "slot": 1, "name": "积分法", "selection_type": "学校", "category": "学校制", "status": "定制", "school_type": "国学", "evolution": "六堂诸生有积分之法；升至率性乃积分；岁内积八分者为及格，与出身。", "agencies": [{"text": "国子监", "ent_keys": ["ent:guozijian"], "ent_ids": ["ENT-22501"]}], "targets": ["监生"], "obj_keys": ["obj:jifen"], "tme_keys": ["tme:chongzheng-fujifen"], "ent_keys": ["ent:guozijian"], "src_loc": "卷45-L08", "confidence": 0.95, "evidence": "升至率性，乃积分。其法……岁内积八分者为及格，与出身。", "id": "REG-22504", "obj_ids": ["OBJ-22501"], "tme_ids": ["TME-22505"], "ent_ids": ["ENT-22501"], "_layer": "regs"}, "REG-22505": {"key": "reg:lishi", "vol": 45, "item_id": "45-014", "slot": 1, "name": "监生历事", "selection_type": "学校", "category": "学校制", "status": "定制", "school_type": "国学", "evolution": "监生历事，始于洪武五年；建文定考核上、中、下三等；天顺前在监十馀年然后拨历诸司。", "agencies": [{"text": "诸司（吏户礼兵刑工都督府等）", "ent_keys": ["ent:guozijian"], "ent_ids": ["ENT-22501"]}], "targets": ["监生"], "proc_keys": ["proc:lishi"], "struct_keys": ["q:lishi-zhengli", "q:lishi-zali"], "tme_keys": ["tme:hzd-lishi"], "ent_keys": ["ent:guozijian"], "src_loc": "卷45-L15", "confidence": 0.95, "evidence": "监生历事，始于洪武五年……上等选用，中、下等仍历一年再考。", "id": "REG-22505", "proc_ids": ["PROC-22502"], "struct_ids": ["QUAN-22504", "QUAN-22505"], "tme_ids": ["TME-22506"], "ent_ids": ["ENT-22501"], "_layer": "regs"}, "REG-22506": {"key": "reg:tixue", "vol": 45, "item_id": "45-015", "slot": 1, "name": "提学官制", "selection_type": "学校", "category": "学校制", "status": "定制", "school_type": "府州县学", "evolution": "正统元年始特置提学官；天顺六年复设，各赐敕谕十八条；专督学校，不理刑名。", "agencies": [{"text": "提学官", "ent_keys": [], "ent_ids": []}], "targets": ["生员"], "ent_keys": ["ent:guozijian"], "src_loc": "卷45-L16", "confidence": 0.94, "evidence": "正统元年始特置提学官，专使提督学政……提学之职，专督学校，不理刑名。", "id": "REG-22506", "ent_ids": ["ENT-22501"], "_layer": "regs"}, "REG-22507": {"key": "reg:shengyuan-kaoshi", "vol": 45, "item_id": "45-016", "slot": 1, "name": "生员岁考/科考", "selection_type": "学校", "category": "学校制", "status": "定制", "school_type": "府州县学", "evolution": "提学官三岁两试：先六等岁考，次取一二等为科举生员应乡试，谓之科考。", "agencies": [{"text": "提学官", "ent_keys": [], "ent_ids": []}], "targets": ["生员"], "ent_keys": ["ent:guozijian"], "src_loc": "卷45-L16", "confidence": 0.94, "evidence": "继取一二等为科举生员，俾应乡试，谓之科考。", "id": "REG-22507", "ent_ids": ["ENT-22501"], "_layer": "regs"}, "REG-23001": {"key": "reg:keju-sanji", "vol": 46, "item_id": "46-010", "slot": 1, "name": "科举三级考试", "selection_type": "科目", "category": "科举制", "status": "定制", "exam_tier": "殿试", "evolution": "沿唐、宋之旧，而稍变其试士之法；三年大比，乡试、会试、殿试三级。", "agencies": [{"text": "礼部", "cross_kb": "mingshi-zhiguanzhi", "ent_keys": ["ent:libu"], "ent_ids": ["ENT-23001"]}], "targets": ["举人", "贡士", "进士"], "cross_ref": [{"kb": "mingshi-shihuozhi", "note": "科费/廪给"}], "tme_keys": ["tme:hongwu-kaike", "tme:hongwu-dinghi", "tme:wuyuan-wuke"], "evt_keys": ["evt:nanbei-bang"], "proc_keys": ["proc:keju-sanji"], "ent_keys": ["e (function(){
  const KG = window.KG;
  const $ = s => document.querySelector(s);
  const main = $("#main");
  let state = {vol:"all", layer:"all", mode:"item", q:""};

  // 统计
  const totalItems = KG.items.length;
  const totalRecs = Object.keys(KG.byId).length;
  const joinN = KG.items.length;
  $("#stats").innerHTML = [
    ["3","卷 (45/46/47)"],["11","层"],["totalRecs","记录"],["joinN","跨层索引"]
  ].map(([b,s])=>`<div class="stat"><b>${b}</b><span>${s}</span></div>`).join("");

  // 卷 tabs
  const vols = [["all","全部"],["45","卷45"],["46","卷46"],["47","卷47"]];
  $("#volTabs").innerHTML = vols.map(([v,t])=>
    `<div class="tab${v==='all'?' active':''}" data-v="${v}">${t}</div>`).join("");
  // 层 tabs
  const layers = Object.keys(KG.layers);
  let lt = `<div class="tab${'all'==='all'?' active':''}" data-l="all">全部 <small>${totalRecs}</small></div>`;
  layers.forEach(l=>{
    const c = KG.layerCounts[l]||0;
    lt += `<div class="tab" data-l="${l}">${KG.layers[l]} <small>${c}</small></div>`;
  });
  $("#layerTabs").innerHTML = lt;

  // 事件
  $("#volTabs").addEventListener("click",e=>{
    const t=e.target.closest(".tab"); if(!t)return;
    state.vol=t.dataset.v;
    [...$("#volTabs").children].forEach(x=>x.classList.toggle("active",x===t));
    render();
  });
  $("#layerTabs").addEventListener("click",e=>{
    const t=e.target.closest(".tab"); if(!t)return;
    state.layer=t.dataset.l;
    [...$("#layerTabs").children].forEach(x=>x.classList.toggle("active",x===t));
    render();
  });
  document.querySelectorAll("[data-mode]").forEach(el=>{
    el.addEventListener("click",()=>{
      state.mode=el.dataset.mode;
      document.querySelectorAll("[data-mode]").forEach(x=>x.classList.toggle("active",x===el));
      render();
    });
  });
  $("#search").addEventListener("input",e=>{state.q=e.target.value.trim();render();});

  function esc(s){return String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));}
  function hl(s){
    s=esc(s);
    if(state.q){const q=state.q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
      s=s.replace(new RegExp(q,'gi'),m=>`<mark>${m}</mark>`);}
    return s;
  }
  function recName(r){return r.name||r.title||r.content||r.text||r.who?.text||r.era?.text||r.id||"?";}
  function classOf(id){
    if(id.startsWith("ENT-"))return"ent";
    if(id.startsWith("TME-"))return"tme";
    if(id.startsWith("EVT-"))return"evt";
    return"";
  }
  function chip(id){
    const r=KG.byId[id]; const nm=r?recName(r):id;
    return `<span class="chip ${classOf(id)}" data-id="${id}">${esc(nm)}</span>`;
  }
  function crossChips(rec){
    let out=[];
    for(const k in rec){
      if(k.startsWith("_"))continue;
      const v=rec[k];
      if(k.endsWith("_ids")&&Array.isArray(v)){v.forEach(x=>out.push(chip(x)));}
      else if(Array.isArray(v)){
        v.forEach(x=>{if(typeof x==="string"&&IDP(x))out.push(chip(x));});
      } else if(typeof v==="string"&&IDP(v)){
        out.push(chip(v));
      }
    }
    return out.length?`<div class="chips">${out.join("")}</div>`:"";
  }
  function IDP(s){return /^(ENT|REG|TME|PROC|EVT|OPN|NAM|FRD|OBJ|RULE|EVO|QUAN|INST|STRUCT)-/.test(s);}

  function kvOf(rec){
    const skip=new Set(["_layer","id","key","vol","item_id","slot","confidence","src_loc",
      "evidence","name","title","content","text","who","era","related_evo","related_reg",
      "ent_keys","tme_keys","proc_keys","reg_keys","evt_keys","rule_keys","opn_keys",
      "nam_keys","frd_keys","obj_keys","struct_keys","related_evo_key","related_reg_key"]);
    let h="";
    for(const k in rec){
      if(skip.has(k))continue;
      const v=rec[k];
      let val="";
      if(v===null||v===undefined||v==="")continue;
      if(Array.isArray(v)){
        if(v.length&&typeof v[0]==="object"){
          val=v.map(o=>Object.entries(o).map(([a,b])=>`${a}:${b}`).join(" | ")).join("；");
        } else val=v.join("、");
      } else if(typeof v==="object"){
        val=Object.entries(v).map(([a,b])=>`${a}:${b}`).join("，");
      } else val=String(v);
      if(!val)continue;
      h+=`<div class="k">${esc(k)}</div><div class="v">${hl(val)}</div>`;
    }
    return h?`<div class="kv">${h}</div>`:"";
  }

  function itemCard(it){
    const layerKeys=layers.filter(l=>(it.layers[l]||[]).length>0);
    const badges=layerKeys.map(l=>`<span class="badge">${KG.layers[l]}</span>`).join("");
    return `<div class="item-row" data-item="${it.item_id}">
      <span class="iid">${it.item_id}</span>
      <span class="vol">${KG.volNames[it.volume]||it.volume}</span>
      <span class="badges">${badges}</span>
      <span class="lc">贯通 ${it.layer_count} 层</span>
    </div>`;
  }

  function render(){
    if(state.mode==="qa")return renderQA();
    if(state.mode==="layer")return renderLayer();
    renderItems();
  }

  function renderItems(){
    let list=KG.items.filter(it=>(state.vol==="all"||it.volume===state.vol));
    if(state.layer!=="all")list=list.filter(it=>(it.layers[state.layer]||[]).length>0);
    if(state.q){
      list=list.filter(it=>{
        const ids=[].concat(...layers.map(l=>it.layers[l]||[]));
        return ids.some(id=>{const r=KG.byId[id];return r&&JSON.stringify(r).toLowerCase().includes(state.q.toLowerCase());});
      });
    }
    let html=`<div class="crumb">按条目 · ${state.vol==="all"?"全部卷":KG.volNames[state.vol]} · ${state.layer==="all"?"全部层":KG.layers[state.layer]} · 共 ${list.length} 条</div>`;
    if(!list.length)html+=`<div class="empty">无匹配条目</div>`;
    html+=list.map(itemCard).join("");
    main.innerHTML=html;
    main.querySelectorAll(".item-row").forEach(el=>el.onclick=()=>showItem(el.dataset.item));
  }

  function renderLayer(){
    let ids=KG.byLayer[state.layer]||[];
    let recs=ids.map(id=>KG.byId[id]).filter(Boolean);
    if(state.vol!=="all")recs=recs.filter(r=>String(r.vol)===state.vol);
    if(state.q)recs=recs.filter(r=>JSON.stringify(r).toLowerCase().includes(state.q.toLowerCase()));
    let html=`<div class="crumb">按层 · ${KG.layers[state.layer]||state.layer} · ${state.vol==="all"?"全部卷":KG.volNames[state.vol]} · 共 ${recs.length} 条</div>`;
    if(!recs.length)html+=`<div class="empty">无匹配记录</div>`;
    html+=recs.map(recCard).join("");
    main.innerHTML=html;
    bindChips();
  }

  function recCard(r){
    const layer=KG.layers[r._layer]||r._layer;
    let h=`<div class="card"><h4>${hl(recName(r))} <span style="font-size:12px;color:var(--sub)">${r.id} · ${layer}</span></h4>`;
    h+=`<div class="src">卷${r.vol} · item ${r.item_id} · ${r.src_loc||""} · 置信度 ${r.confidence??""}</div>`;
    if(r.evidence)h+=`<div class="v" style="margin-top:6px;color:var(--ink)">${hl(r.evidence)}</div>`;
    h+=kvOf(r);
    h+=crossChips(r);
    h+=`</div>`;
    return h;
  }

  function showItem(iid){
    const it=KG.items.find(x=>x.item_id===iid); if(!it)return;
    let html=`<div class="crumb"><a id="back">← 返回列表</a> · 条目 ${iid} · ${KG.volNames[it.volume]||it.volume} · 贯通 ${it.layer_count} 层</div>`;
    layers.forEach(l=>{
      const ids=it.layers[l]||[];
      if(!ids.length)return;
      html+=`<div class="sec-title">${KG.layers[l]}（${ids.length}）</div>`;
      ids.forEach(id=>{
        const r=KG.byId[id]; if(!r)return;
        html+=recCard(r);
      });
    });
    main.innerHTML=html;
    $("#back").onclick=render;
    bindChips();
  }

  function renderQA(){
    let html=`<div class="crumb">十问验收（与 query_acceptance.txt 对应，10/10 能答）</div>`;
    KG.qa.forEach((q,i)=>{
      const go=q.jump.type==="item"?`→ 查看条目 ${q.jump.value}`:`→ 检索「${q.jump.value}」`;
      html+=`<div class="qa"><div class="q" data-i="${i}">${i+1}. ${esc(q.q)}</div>
        <div class="a">${esc(q.a)}</div>
        <span class="go" data-i="${i}">${go}</span></div>`;
    });
    main.innerHTML=html;
    main.querySelectorAll(".qa .q,.qa .go").forEach(el=>el.onclick=()=>{
      const q=KG.qa[+el.dataset.i];
      if(q.jump.type==="item"){showItem(q.jump.value);}
      else{document.querySelector('[data-mode="item"]').click();
           $("#search").value=q.jump.value;state.q=q.jump.value;render();}
    });
  }

  function bindChips(){
    main.querySelectorAll(".chip[data-id]").forEach(el=>el.onclick=()=>{
      const id=el.dataset.id; const r=KG.byId[id];
      if(r&&r.item_id)showItem(r.item_id);
      else if(r)main.insertAdjacentHTML("afterbegin",recCard(r));
    });
  }

  render();
})();
</script>
</body>
</html>
