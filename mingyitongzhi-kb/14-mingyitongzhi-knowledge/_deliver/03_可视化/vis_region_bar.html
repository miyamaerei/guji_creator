<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>大明一统志 - 各布政司数据量</title>
<script src="https://unpkg.com/echarts@5/dist/echarts.min.js"></script>
<style>
body { font-family: "Microsoft YaHei", sans-serif; margin: 20px; background: #f5f5f5; }
h1 { color: #333; }
#chart { width: 100%; height: 700px; background: white; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
</style>
</head>
<body>
<h1>大明一统志 · 各布政司 GEO 节点数</h1>
<div id="chart"></div>
<script>
const chart = echarts.init(document.getElementById('chart'));

fetch('../geo_tree.json')
  .then(r => r.json())
  .then(data => {
    const regions = Object.keys(data.regions);
    const counts = regions.map(r => data.regions[r].count);

    const option = {
      tooltip: { trigger: 'axis', axisPointer: { type: 'shadow' } },
      grid: { left: '3%', right: '4%', bottom: '3%', containLabel: true },
      xAxis: { type: 'category', data: regions, axisLabel: { rotate: 45, fontSize: 12 } },
      yAxis: { type: 'value', name: 'GEO 节点数' },
      series: [{
        name: 'GEO 节点数',
        type: 'bar',
        data: counts,
        itemStyle: { color: '#2f4554' },
        label: { show: true, position: 'top', fontSize: 11 }
      }]
    };
    chart.setOption(option);
  });

window.addEventListener('resize', () => chart.resize());
</script>
</body>
</html>
