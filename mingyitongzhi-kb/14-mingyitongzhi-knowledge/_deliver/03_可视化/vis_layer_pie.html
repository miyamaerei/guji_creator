<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>大明一统志 - 7层数据分布</title>
<script src="https://unpkg.com/echarts@5/dist/echarts.min.js"></script>
<style>
body { font-family: "Microsoft YaHei", sans-serif; margin: 20px; background: #f5f5f5; }
h1 { color: #333; }
#chart { width: 100%; height: 600px; background: white; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
</style>
</head>
<body>
<h1>大明一统志 · 7 层数据分布</h1>
<div id="chart"></div>
<script>
const chart = echarts.init(document.getElementById('chart'));

const data = [
  { value: 5939, name: 'ent 实体' },
  { value: 2006, name: 'geo 地理' },
  { value: 3058, name: 'evo 沿革' },
  { value: 11168, name: 'mtn 山川' },
  { value: 13540, name: 'per 人物' },
  { value: 12432, name: 'site 古迹寺观' },
  { value: 1286, name: 'cit 祠庙' }
];

const option = {
  tooltip: { trigger: 'item', formatter: '{b}: {c} 条 ({d}%)' },
  legend: { orient: 'vertical', left: 'left' },
  series: [{
    type: 'pie',
    radius: '50%',
    center: ['60%', '50%'],
    data: data,
    emphasis: { itemStyle: { shadowBlur: 10, shadowOffsetX: 0, shadowColor: 'rgba(0, 0, 0, 0.5)' } },
    label: { formatter: '{b}\n{c} 条' }
  }]
};
chart.setOption(option);

window.addEventListener('resize', () => chart.resize());
</script>
</body>
</html>
