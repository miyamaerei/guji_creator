<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>古集·进度看板（Vue3）</title>
<link rel="stylesheet" href="vendor/element-plus.css">
<script src="vendor/vue.global.prod.js"></script>
<script src="vendor/element-plus.full.min.js"></script>
<script src="vendor/echarts.min.js"></script>
<style>
  body{margin:0;background:#f6f1e7;font-family:"Songti SC","Noto Serif SC","SimSun",serif;color:#2b2117}
  #app{max-width:1440px;margin:0 auto;padding:0 20px 60px}
  .topbar{background:#2b2117;color:#f2ead8;padding:12px 22px;display:flex;align-items:center;gap:16px;margin:0 -20px 8px}
  .topbar .brand{font-size:20px;font-weight:700;letter-spacing:2px}
  .topbar .note{color:#c9bda0;font-size:12px}
  .topbar .el-tabs__item{color:#cbbda0}
  .topbar .el-tabs__item.is-active{color:#fff}
  .topbar .el-tabs__active-bar{background:#a67c00}
  .topbar .el-tabs__nav-wrap::after{background:#4a4136}
  .json{background:#211d16;color:#e8e0cf;border-radius:8px;padding:12px 16px;font-family:Consolas,monospace;font-size:12.5px;line-height:1.6;overflow:auto;white-space:pre;margin:0;max-height:460px}
  .jk{color:#e5c07b;font-weight:700}.jv{color:#9ec68a}
  .okdot{color:#3f9d47;font-weight:700}
  .nodot{color:#c0392b}
  .unqdot{color:#a67c00;font-weight:700}
  .muted{color:#8a7c66;font-size:12px}
  .booklink{color:#8b1f1f;cursor:pointer;text-decoration:none}
  .filterbar{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin:10px 0}
  .dimrow{opacity:.55}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  @media(max-width:980px){.grid2{grid-template-columns:1fr}}
  /* 类别目录 + 详情 双栏 */
  .layout{display:grid;grid-template-columns:285px 1fr;gap:16px;align-items:start}
  @media(max-width:900px){.layout{grid-template-columns:1fr}}
  .catnav{background:#fffdf7;border:1px solid #d9cdb6;border-radius:10px;padding:10px 12px;position:sticky;top:8px;max-height:88vh;overflow:auto}
  .catnav h4{margin:12px 0 4px;font-size:13px;color:#8b1f1f;border-bottom:1px dashed #d9cdb6;padding-bottom:3px}
  .catnav .item{display:flex;justify-content:space-between;align-items:center;padding:5px 8px;border-radius:6px;cursor:pointer;font-size:13px}
  .catnav .item:hover{background:#efe6d3}
  .catnav .item.on{background:#2b2117;color:#f2ead8}
  .catnav .item .cnt{font-size:11px;opacity:.75}
  .detail{background:#fffdf7;border:1px solid #d9cdb6;border-radius:10px;padding:14px 18px;min-height:400px}
  .el-collapse-item__header{background:#f7efdd;border-radius:6px;padding-left:8px;font-weight:600}
  .toolbar-row{display:flex;gap:8px;align-items:center;margin:6px 0}
  .jc{color:#8b9a7b}
  .volprog{margin:6px 0;font-weight:600;color:#8b1f1f;font-size:13px}
  .tlday{background:#fffdf7;border:1px solid #d9cdb6;border-radius:10px;padding:10px 16px;margin:12px 0}
  .tlday h4{margin:2px 0 6px;color:#8b1f1f}
  .tl-axis{position:relative;height:18px;margin-left:150px}
  .tl-axis .tick{position:absolute;transform:translateX(-50%);font-size:11px;color:#8a7c66}
  .tl-axis .tick::after{content:'';position:absolute;left:50%;top:16px;width:1px;height:6px;background:#d9cdb6}
  .tl-lane{display:flex;align-items:center;border-top:1px dashed #e2d7c0;min-height:26px}
  .lnName{width:150px;flex:none;font-size:13px}
  .lnTrack{position:relative;flex:1;height:26px}
  .lnTrack::before{content:'';position:absolute;left:0;right:0;top:50%;border-top:1px solid #efe6d3}
  .dot{position:absolute;top:50%;width:13px;height:13px;border-radius:50%;transform:translate(-50%,-50%);box-shadow:0 0 0 2px #fffdf7;cursor:help}
  .lgdot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:4px}
  .bookpage{background:#fffdf7;border:1px solid #d9cdb6;border-radius:10px;padding:16px 20px}
  .flowcard{border:1px solid #d9cdb6;border-left:5px solid #a67c00;background:#f7efdd;border-radius:8px;padding:10px 14px;margin:12px 0;font-size:13.5px}
  .flowcard .nx{color:#8b1f1f;font-weight:700}
  .legendbox{background:#fffdf7;border:1px dashed #d9cdb6;border-radius:8px;padding:8px 14px;font-size:12.5px;color:#5a4f3e;margin:8px 0;line-height:1.7}
  .chartbox{height:560px;background:#fffdf7;border:1px solid #d9cdb6;border-radius:10px;margin:10px 0}
  .chartbox.one{height:260px}
</style>
</head>
<body>
<div id="app">
  <div class="topbar">
    <span class="brand">古集·进度看板</span>
    <el-tabs v-model="tab" style="flex:1;margin-bottom:-15px">
      <el-tab-pane label="书目总览" name="books"></el-tab-pane>
      <el-tab-pane label="书籍详情" name="book"></el-tab-pane>
      <el-tab-pane label="全量数据结构" name="layers"></el-tab-pane>
      <el-tab-pane label="同层对比" name="compare"></el-tab-pane>
      <el-tab-pane label="时间线" name="timeline"></el-tab-pane>
    </el-tabs>
    <span class="note">盘点 {{D.generated}} · 静态版在 index.html</span>
  </div>

  <!-- ================= 1. 书目总览 ================= -->
  <template v-if="tab==='books'">
    <div class="filterbar">
      <el-input v-model="q" placeholder="搜索书名 / 目录 / 作者 / 性质" clearable style="width:280px"></el-input>
      <el-select v-model="fStatus" placeholder="状态" clearable style="width:130px">
        <el-option label="✅ 完成" value="done"></el-option><el-option label="🚧 在建" value="wip"></el-option><el-option label="⬜ 无产出" value="none"></el-option>
      </el-select>
      <el-select v-model="fStage" placeholder="当前阶段" clearable style="width:160px">
        <el-option v-for="(s,i) in D.stages" :key="i" :label="s" :value="i"></el-option>
      </el-select>
      <span class="muted">共 {{filteredBooks.length}} / {{D.books.length}} 本</span>
    </div>
    <el-table :data="filteredBooks" border stripe size="small" row-key="id">
      <el-table-column type="index" label="#" width="42"></el-table-column>
      <el-table-column label="书名" min-width="190" :sort-by="b=>b.title" sortable>
        <template #default="{row}">
          <a class="booklink" @click="openBook(row)"><b>《{{row.title}}》</b></a>
          <div class="muted">{{row.dir}}</div>
        </template>
      </el-table-column>
      <el-table-column prop="author" label="作者·时代" width="150"></el-table-column>
      <el-table-column prop="genre" label="性质" min-width="160" show-overflow-tooltip></el-table-column>
      <el-table-column label="状态" width="92" align="center">
        <template #default="{row}"><el-tag :type="stTag[row.status]" size="small" effect="dark">{{stTxt2[row.status]}}</el-tag></template>
      </el-table-column>
      <el-table-column label="层数" width="70" align="center" :sort-by="b=>b.layers.length" sortable>
        <template #default="{row}"><b>{{row.layers.length||'—'}}</b></template>
      </el-table-column>
      <el-table-column prop="items" label="底座" width="120"></el-table-column>
      <el-table-column label="产出记录" width="100" align="center" :sort-by="b=>b.records" sortable>
        <template #default="{row}">{{row.records?row.records.toLocaleString():'—'}}</template>
      </el-table-column>
      <el-table-column label="当前阶段" width="150" align="center">
        <template #default="{row}"><el-tag size="small" :type="row.curState===2?'success':'warning'" effect="plain">{{row.curLabel}}</el-tag></template>
      </el-table-column>
      <el-table-column label="流程最后执行" width="140" :sort-by="b=>b.lastRun" sortable>
        <template #default="{row}"><span class="muted">{{row.lastRun}}</span></template>
      </el-table-column>
      <el-table-column label="总进度" width="150">
        <template #default="{row}"><el-progress :percentage="row.pct" :stroke-width="12" text-inside></el-progress></template>
      </el-table-column>
    </el-table>
  </template>

  <!-- ================= 1b. 书籍详情（点书名进入，非弹窗） ================= -->
  <template v-if="tab==='book'">
    <div v-if="cur.id" class="bookpage">
      <div class="toolbar-row" style="margin-bottom:8px">
        <el-button size="small" @click="tab='books'">← 返回书目总览</el-button>
        <b style="font-size:18px">《{{cur.title}}》</b>
        <el-tag :type="stTag[cur.status]" size="small" effect="dark">{{stTxt2[cur.status]}}</el-tag>
        <span class="muted">{{cur.author}} · {{cur.genre}} · 目录 <code>{{cur.dir}}</code> · 底座 {{cur.items}}</span>
      </div>
      <el-steps :active="cur.active" finish-status="success" align-center>
        <el-step v-for="(s,i) in D.stages" :key="i" :title="s" :description="stepDesc(cur,i)" :status="stepStatus(i)"></el-step>
      </el-steps>
      <p v-if="volText(cur)" class="volprog">卷进度：{{volText(cur)}}</p>

      <div class="flowcard" v-if="curFlow">
        <div>当前节点：<b>{{curFlow.name}}</b>
          <el-tag size="small" :type="curFlow.state===2?'success':'warning'">{{curFlow.state===2?'该阶段已完成':'该阶段进行中'}}</el-tag>
          　标志：{{curFlow.mark}}</div>
        <div class="nx" style="margin-top:4px">下一步：{{curFlow.next}}</div>
      </div>

      <h4 style="margin:14px 0 6px;color:#8b1f1f">整体流程 · 逐段标志与下一步</h4>
      <el-table :data="flowRows(cur)" border size="small">
        <el-table-column label="阶段" width="110">
          <template #default="{row}"><span class="lgdot" :style="{background:STAGEC[row.i]}"></span>{{row.name}}</template>
        </el-table-column>
        <el-table-column prop="goal" label="这一步在做什么" min-width="220"></el-table-column>
        <el-table-column prop="mark" label="完成标志" min-width="230"></el-table-column>
        <el-table-column label="本书状态" width="110" align="center">
          <template #default="{row}"><el-tag size="small" :type="row.st==='完成'?'success':row.st==='进行中'?'warning':'info'" effect="plain">{{row.st}}</el-tag></template>
        </el-table-column>
        <el-table-column label="执行时间" width="130">
          <template #default="{row}"><span class="muted">{{row.time}}</span></template>
        </el-table-column>
        <el-table-column label="下一步该怎么做" min-width="200">
          <template #default="{row}">{{row.next}}</template>
        </el-table-column>
      </el-table>

      <p style="margin:10px 0">{{cur.notes}}</p>
      <el-collapse v-if="cur.drift&&cur.drift.length">
        <el-collapse-item title="⚠ 与标准流程 / 全量契约的偏移点" name="d">
          <ul style="margin:4px 0;padding-left:20px"><li v-for="x in cur.drift" :key="x" style="margin:3px 0">{{x}}</li></ul>
        </el-collapse-item>
      </el-collapse>
      <el-table v-if="cur.layers&&cur.layers.length" :data="cur.layerRows" border size="small" style="margin-top:12px">
        <el-table-column prop="key" label="层" width="110"><template #default="{row}"><code>{{row.key}}</code></template></el-table-column>
        <el-table-column prop="name" label="含义" width="200"></el-table-column>
        <el-table-column prop="count" label="记录数" width="90" align="center"></el-table-column>
        <el-table-column label="record 字段（中文标注见「全量数据结构」页）">
          <template #default="{row}"><code v-for="f in row.fields" :key="f" style="margin-right:4px">{{f}}</code><span v-if="!row.fields" class="muted">沿工厂契约 / 本书特化</span></template>
        </el-table-column>
      </el-table>
    </div>
    <p v-else class="muted" style="padding:30px 4px">← 请在「书目总览」或时间线中点击书名进入本书详情。</p>
  </template>

  <!-- ================= 2. 全量数据结构（左类别目录 + 右层详情，每本书可展开收起） ================= -->
  <template v-if="tab==='layers'">
    <div class="filterbar">
      <el-input v-model="layerQ" placeholder="筛层名 / 字段" clearable style="width:260px"></el-input>
      <span class="muted">归一层 {{allLayerKeys.length}} 种 · 书×层 {{totalPairs}} 对 · 选择左侧类别/层，再用「选书」下拉多选展开各书字段 JSON</span>
    </div>
    <div class="layout">
      <!-- 左侧类别目录 -->
      <aside class="catnav">
        <template v-for="g in navGroups" :key="g.name">
          <div v-if="g.list.length">
            <h4>{{g.name}}</h4>
            <div v-for="L in g.list" :key="L.key" class="item" :class="{on:selLayer&&selLayer.key===L.key}" @click="pickLayer(L)">
              <span><code>{{L.key}}</code> {{L.name}}</span>
              <span class="cnt">{{L.books.length}}书/{{L.total.toLocaleString()}}</span>
            </div>
          </div>
        </template>
      </aside>

      <!-- 右侧层详情 -->
      <section class="detail" v-if="selLayer">
        <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">
          <el-tag type="warning" effect="dark">{{selLayer.key}}</el-tag>
          <b style="font-size:17px">{{selLayer.name}}</b>
          <el-tag size="small" :type="selLayer.custom?'danger':'info'" effect="plain">{{selLayer.custom?'本书自定义层':'工厂层库'}}</el-tag>
          <span class="muted">{{selLayer.desc}}</span>
        </div>

        <div class="toolbar-row">
          <el-select v-model="layerSel" multiple filterable collapse-tags collapse-tags-tooltip placeholder="选择要展开的书（可多选）" style="min-width:340px;max-width:640px">
            <el-option v-for="fb in selLayer.bookFields" :key="fb.id" :label="'《'+fb.title+'》 '+fb.count.toLocaleString()+' 条'" :value="fb.id"></el-option>
          </el-select>
          <el-button size="small" @click="layerSel=selLayer.bookFields.map(x=>x.id)">全选</el-button>
          <el-button size="small" @click="layerSel=[]">清空</el-button>
          <el-button size="small" :type="openAllJson?'primary':''" plain @click="openAllJson=!openAllJson">层 JSON 骨架</el-button>
          <span class="muted">产出 {{selLayer.books.length}} 本 · 合计 {{selLayer.total.toLocaleString()}} 条</span>
        </div>

        <div class="json" v-if="openAllJson" v-html="layerJson(selLayer)"></div>

        <!-- 选中的书逐一展开，可单独收起 -->
        <el-collapse v-if="layerSel.length" v-model="bookOpen" style="margin-top:10px">
          <el-collapse-item v-for="fb in selLayer.bookFields.filter(x=>layerSel.includes(x.id))" :key="fb.id" :name="fb.id">
            <template #title>
              <div style="display:flex;gap:10px;align-items:center;width:100%">
                <b>《{{fb.title}}》</b>
                <span class="muted">{{fb.count.toLocaleString()}} 条</span>
                <template v-if="fb.fields">
                  <el-tag v-if="fb.uniq.length" size="small" type="warning">偏移 {{fb.uniq.length}} 字段</el-tag>
                  <el-tag v-if="fb.miss.length" size="small" type="danger">缺共性 {{fb.miss.length}}</el-tag>
                  <el-tag v-if="!fb.uniq.length&&!fb.miss.length" size="small" type="success">与主流一致</el-tag>
                </template>
                <el-tag v-else size="small" type="info">沿工厂契约（未逐字段采集）</el-tag>
              </div>
            </template>
            <div class="json" v-html="bookLayerJson(selLayer.key, fb)"></div>
          </el-collapse-item>
        </el-collapse>
        <p v-else class="muted" style="margin:8px 0">▸ 在上方选择一本书或多本书后展开其字段 JSON；点「层 JSON 骨架」看本层通用结构。</p>
        <div v-if="selLayer.bookFields.length===0" class="muted">本层仅在层库登记，暂无书籍产出。</div>
      </section>
      <section class="detail" v-else><p class="muted">← 从左侧类别目录选择一个层</p></section>
    </div>
  </template>

  <!-- ================= 3. 同层对比（矩阵 + 每本书 JSON 可展开收起/切换） ================= -->
  <template v-if="tab==='compare'">
    <div class="filterbar">
      <span>选择层：</span>
      <el-select v-model="cmpLayer" filterable style="width:260px" @change="cmpOpen=[]">
        <el-option v-for="k in cmpKeys" :key="k" :label="k+' · '+(D.layerNames[k]||'')" :value="k"></el-option>
      </el-select>
      <el-select v-model="cmpOnly" placeholder="高亮某本书" clearable filterable style="width:200px">
        <el-option v-for="b in cmpBooks" :key="b" :label="'《'+bookOf(b).title+'》'" :value="b"></el-option>
      </el-select>
      <el-switch v-model="cmpAnnot" active-text="字段列带中文"></el-switch>
      <span class="muted">绿✓=共性　黄●=偏移/独有　红✗=缺共性　—=沿契约</span>
    </div>

    <el-table :data="cmpRows" border size="small" max-height="480" :row-class-name="({row})=>row.common?'':'dimrow'">
      <el-table-column prop="field" label="字段" fixed width="210">
        <template #default="{row}">
          <code>{{row.field}}</code>
          <div v-if="cmpAnnot" class="muted" style="line-height:1.3">{{fDesc(row.field)}}</div>
          <el-tag v-if="row.heat===cmpKnown" size="small" type="success" effect="plain">全有</el-tag>
          <el-tag v-else-if="row.heat<cmpMajority" size="small" type="info" effect="plain">少数</el-tag>
        </template>
      </el-table-column>
      <el-table-column v-for="b in cmpBooks" :key="b" :label="'《'+bookOf(b).title+'》'" width="126" align="center">
        <template #default="{row}"><span :class="cmpCellCls(b,row)">{{ cmpMark(b,row) }}</span></template>
      </el-table-column>
    </el-table>

    <div class="grid2" style="margin-top:16px">
      <div class="detail">
        <b>差异摘要</b>
        <div v-for="s in cmpSummary" :key="s.id" style="margin:8px 0;font-size:13px">
          <a class="booklink" @click="cmpOnly=s.id">《{{s.title}}》</a>
          <template v-if="s.uniq.length"> 偏移/独有 <el-tag v-for="f in s.uniq" :key="f" size="small" type="warning" style="margin:1px">{{f}}</el-tag></template>
          <template v-if="s.miss.length"> 缺共性 <el-tag v-for="f in s.miss" :key="f" size="small" type="danger" style="margin:1px">{{f}}</el-tag></template>
          <span v-if="!s.uniq.length&&!s.miss.length" class="muted">与主流一致</span>
        </div>
      </div>
      <div class="detail">
        <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">
          <b>各书 JSON（{{cmpLayer}} 层）</b>
          <el-button size="small" @click="cmpOpen=cmpKnownIds">全部展开</el-button>
          <el-button size="small" @click="cmpOpen=[]">全部收起</el-button>
          <el-select v-model="cmpSwitch" placeholder="切换查看一本书" filterable clearable size="small" style="width:190px" @change="v=>{if(v)cmpOpen=[v]}">
            <el-option v-for="id in cmpKnownIds" :key="id" :label="'《'+bookOf(id).title+'》'" :value="id"></el-option>
          </el-select>
        </div>
        <el-collapse v-model="cmpOpen" style="margin-top:8px">
          <el-collapse-item v-for="id in cmpKnownIds" :key="id" :name="id">
            <template #title>
              <div style="display:flex;gap:10px;align-items:center;width:100%">
                <b>《{{bookOf(id).title}}》</b>
                <el-tag v-if="uniqOf(id).length" size="small" type="warning">偏移 {{uniqOf(id).length}}</el-tag>
                <el-tag v-if="missOf(id).length" size="small" type="danger">缺共性 {{missOf(id).length}}</el-tag>
                <el-tag v-if="!uniqOf(id).length&&!missOf(id).length" size="small" type="success">与主流一致</el-tag>
              </div>
            </template>
            <div class="json" v-html="cmpBookJson(id)"></div>
          </el-collapse-item>
        </el-collapse>
      </div>
    </div>
  </template>

  <!-- ================= 4. 时间线（ECharts 全书/单书 + 按天 DOM 视图，共用 GTIMES 阶段数据） ================= -->
  <template v-if="tab==='timeline'">
    <div class="filterbar">
      <el-radio-group v-model="tlMode" size="small">
        <el-radio-button value="chart">全书时间轴（可缩放）</el-radio-button>
        <el-radio-button value="one">单书时间轴</el-radio-button>
        <el-radio-button value="dom">按天 · 明细视图</el-radio-button>
      </el-radio-group>
      <el-select v-if="tlMode==='one'" v-model="tlBook" filterable placeholder="选择一本书" style="width:220px">
        <el-option v-for="b in tlChartBooks" :key="b.id" :label="'《'+b.title+'》'" :value="b.id"></el-option>
      </el-select>
      <el-input v-if="tlMode==='dom'" v-model="tlQ" placeholder="筛书名 / 目录（只看一本书即单书时间轴）" clearable style="width:250px"></el-input>
      <el-checkbox-group v-model="tlStages" style="display:flex;gap:4px;flex-wrap:wrap">
        <el-checkbox v-for="(s,i) in D.stages" :key="i" :value="i"><span class="lgdot" :style="{background:STAGEC[i]}"></span>{{s}}</el-checkbox>
      </el-checkbox-group>
    </div>

    <div class="legendbox">
      <b>图例说明：</b>每个圆点 = <b>某一本书某一流程阶段</b>的最后一次执行——纵向位置是书名（行），横向位置是执行时刻，<b>颜色对应七个流程阶段</b>：
      <span v-for="(s,i) in D.stages" :key="i" style="margin:0 6px"><span class="lgdot" :style="{background:STAGEC[i]}"></span>{{i}}·{{s}}</span>。
      一本书最多 7 个点，从左到右读出它走完了流程的哪几段。数据与「书目总览」的当前阶段、详情流程表同源（GTIMES 阶段时间戳）。
      ECharts 视图底部有缩放滑条，可框选任一时间区间（也支持滚轮/拖拽平移）；勾选框控制显示哪些阶段。
    </div>

    <div v-show="tlMode!=='dom'" ref="tlChart" class="chartbox" :class="{one:tlMode==='one'}"></div>

    <template v-if="tlMode==='dom'">
      <div class="tlday" v-for="dy in tlDays" :key="dy.date">
        <h4>{{dy.date}}<span class="muted">　{{dy.cnt}} 次阶段执行 · 轴 {{dy.h0}}:00 – {{dy.h1}}:00</span></h4>
        <div class="tl-axis">
          <span v-for="h in dy.hours" :key="h" class="tick" :style="{left:tlPos(h,dy)}">{{h}}时</span>
        </div>
        <div class="tl-lane" v-for="ln in dy.lanes" :key="ln.id">
          <div class="lnName"><a class="booklink" @click="openBook(bookOf(ln.id))">《{{bookOf(ln.id).title}}》</a></div>
          <div class="lnTrack">
            <span v-for="(e,j) in ln.evs" :key="j" class="dot" :style="{left:tlPos(e.h,dy),background:STAGEC[e.s]}" :title="D.stages[e.s]+' · '+e.t"></span>
          </div>
        </div>
      </div>
      <p v-if="!tlDays.length" class="muted">无匹配的阶段执行记录</p>
    </template>
  </template>
</div>

<script src="data.js"></script>
<script src="fields.js"></script>
<script src="times.js"></script>
<script src="stages.js"></script>
<script>
const { createApp, ref, computed, watch, nextTick } = Vue;
const D = window.GDATA, F = window.FIELDS || {};
const GT = window.GTIMES || {}, GV = window.GVOLS || {};
const GS = window.GSTAGES || [];
const STAGEC = ['#8a8578', '#3f6d9d', '#a67c00', '#3f9d47', '#7a4fa3', '#c0563a', '#8b1f1f'];
const pad2 = n => String(n).padStart(2, '0');
const dObj = ms => { const d = new Date(ms); const dt = d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate());
  return { date: dt, h: d.getHours() + d.getMinutes() / 60, t: dt + ' ' + pad2(d.getHours()) + ':' + pad2(d.getMinutes()) }; };
const NORM = {ents:"ent",evts:"event",events:"event",rels:"rel",trls:"trl",appts:"appt",lits:"lit",chrs:"chr",mems:"mem",
  tmes:"tme",structs:"struct",rules:"rule",regs:"reg",opns:"opn",nams:"nam",objs:"obj",geos:"geo",evos:"evo",hyds:"hyd",
  gars:"gar",ress:"res",frds:"frd",cits:"cit",mings:"ming","标注":"ent",offices:"org_profile",tim_topics:"tim",
  geo_profiles:"geo_profile",org_profiles:"org_profile",office_profiles:"office_profile",person_profiles:"person_profile",
  process_profiles:"process_profile",reports:"report",laws:"rule",rituals:"reg",dress:"obj",inspect:"reg",
  foreign:"reg",materials:"num",org_events:"tme",geo_station:"geo"};
const normKey = k => NORM[k] || k;
const fBase = f => f.replace(/[\[\]{}(（].*/,"");
const fDesc = f => F[fBase(f)] || F[f] || "（说明待补）";

D.books.forEach(b=>{
  b.records = b.layers.reduce((x,l)=>x+(l[2]||0),0);
  const gts=(GT[b.id]||[]).filter(x=>x!=null);
  b.lastRun = gts.length ? dObj(Math.max(...gts)).t : '—';
  let cur=-1, curState=0;
  b.stageStates.forEach((s,i)=>{ if(s>0){cur=i;curState=s;} });
  b.pct = Math.round(b.stageStates.reduce((x,s)=>x+s,0)/(b.stageStates.length*2)*100);
  b.curLabel = cur<0 ? "未开工" : D.stages[cur] + (curState===2?" ✓":" 中");
  b.curState = curState; b.active = cur<0?0:cur+(curState===2?1:0);
  b.layerRows = b.layers.map(l=>{
    const k = normKey(l[0]); const m=(D.fieldMatrix[k]||{})[b.id];
    return {key:l[0], name:l[1], count:l[2].toLocaleString(), fields: m===undefined?null:m};
  });
});

const layerBooks = {};
D.books.forEach(b=>b.layers.forEach(l=>{
  const k=normKey(l[0]);
  const hit=(layerBooks[k]=layerBooks[k]||[]).find(x=>x.id===b.id);
  if(!hit) layerBooks[k].push({id:b.id,title:b.title,count:l[2]});
}));
const allLayerKeys = [...new Set([...Object.keys(layerBooks), ...Object.keys(D.fieldMatrix)])];
const groupOf = {}; D.layerGroups.forEach(g=>g.keys.forEach(k=>groupOf[k]=g.name));
const factoryKeys = new Set(["ent","appt","event","rel","lit","cit","obj","cus","opn","ming","nam","geo","reg","trl","rule","struct","proc","doc","mem","chr","tme","frd","evo","hyd","gar","res"]);

function cmpData(key){
  const m = D.fieldMatrix[key]||{};
  const books = Object.keys(m);
  const known = books.filter(b=>m[b]);
  const heat={}; known.forEach(b=>m[b].forEach(f=>heat[f]=(heat[f]||0)+1));
  const fields = Object.keys(heat);
  return {m, books, known, heat, fields, majority: known.length?Math.ceil(known.length/2):2};
}
function layerInfo(k){
  const bs = layerBooks[k]||[]; const cd = cmpData(k);
  const union=[]; const seen=new Set();
  Object.values(cd.m).forEach(fs=>{ if(fs) fs.forEach(x=>{ if(!seen.has(x)){seen.add(x);union.push(x);} }); });
  const bookFields = bs.map(x=>{
    const mine = cd.m[x.id]===undefined?null:cd.m[x.id];
    return {id:x.id,title:x.title,count:x.count,fields:mine,
      uniq: mine?mine.filter(f=>cd.heat[f]===1):[],
      miss: mine?cd.fields.filter(f=>cd.heat[f]===cd.known.length && !mine.includes(f)):[]};
  });
  return { key:k, name:D.layerNames[k]||k, desc:D.layerDesc[k]||"", books:bs,
    total:bs.reduce((x,b)=>x+b.count,0), union, custom:!factoryKeys.has(k), bookFields };
}
function esc(s){ return s.replace(/&/g,"&amp;").replace(/</g,"&lt;"); }
function hlJson(obj){
  let s = esc(JSON.stringify(obj,null,2));
  s = s.replace(/"([^"]*)":/g,'<span class="jk">"$1"</span>:');
  s = s.replace(/: "([^"]*)"/g,': <span class="jv">"$1"</span>');
  // 字段后追加中文备注（// 注释），字段名与结构保持不变
  s = s.split('\n').map(line=>{
    let m = line.match(/^\s*(?:<span class="jk">)?"([^"]+)"(?:<\/span>)?: .+/);
    if(!m) m = line.match(/^\s*(?:<span class="jv">)?"([^"]+)"(?:<\/span>)?,?$/);
    const note = m && (F[m[1]] || F[fBase(m[1])]);
    return note ? line + '<span class="jc">　// ' + esc(note) + '</span>' : line;
  }).join('\n');
  return s;
}
function layerJson(L){
  const rec={}; L.union.forEach(f=>rec[f]="");
  const anc={item_id:"",original:"",norm:"","层_id":"层内主键（打包器分配）",confidence:""};
  return hlJson({ layer:L.key, 说明:L.desc, 是否工厂层库:L.custom?"否（本书自定义层）":"是",
    通用锚点:anc,
    record: Object.keys(rec).length?rec:"（各书沿工厂契约，未逐字段采集）",
    产出书:Object.fromEntries(L.books.map(b=>[b.title,b.count])) });
}
function bookLayerJson(k,fb){
  const rec={}; (fb.fields||[]).forEach(f=>rec[f]="");
  return hlJson({ layer:k, 书名:fb.title, 记录数:fb.count,
    record:Object.keys(rec).length?rec:"沿工厂契约（未逐字段采集）",
    偏移独有:fb.uniq.length?fb.uniq:"无",
    缺失共性:fb.miss.length?fb.miss:"无" });
}

createApp({
  setup(){
    const tab = ref("books");
    const q = ref(""), fStatus = ref(""), fStage = ref(null);
    const cur = ref({});
    const layerQ = ref(""), selLayerKey = ref("ent"), bookOpen = ref([]), layerSel = ref([]), openAllJson = ref(false);
    const cmpLayer = ref("ent"), cmpOnly = ref(""), cmpAnnot = ref(true), cmpOpen = ref([]), cmpSwitch = ref("");

    const stTag = {done:"success", wip:"warning", none:"info"};
    const stTxt2 = {done:"✅ 完成", wip:"🚧 在建", none:"⬜ 无产出"};

    const filteredBooks = computed(()=>D.books.filter(b=>{
      const kw=q.value.trim();
      if(kw && !(b.title+b.dir+b.author+b.genre).includes(kw)) return false;
      if(fStatus.value && b.status!==fStatus.value) return false;
      if(fStage.value!==null && fStage.value!==""){
        let cur2=-1; b.stageStates.forEach((s,i)=>{if(s>0)cur2=i;});
        if(cur2!==fStage.value) return false;
      }
      return true;
    }));

    const allInfo = computed(()=>allLayerKeys.map(layerInfo));
    const filteredLayers = computed(()=>{
      const kw=layerQ.value.trim();
      let ls = allInfo.value;
      if(kw) ls = ls.filter(L=>(L.key+L.name+L.desc+L.union.join("")+L.bookFields.map(x=>x.title).join("")).includes(kw));
      return ls;
    });
    const navGroups = computed(()=>{
      const order = [...D.layerGroups.map(g=>g.name), "其他（归并后散层）"];
      return order.map(name=>({name, list: filteredLayers.value.filter(L=>groupOf[L.key]===name)
        .sort((a,b)=>b.books.length-a.books.length||b.total-a.total)}));
    });
    const selLayer = computed(()=>allInfo.value.find(L=>L.key===selLayerKey.value)||null);
    watch(selLayer, ()=>{ bookOpen.value=[]; layerSel.value=[]; });
    watch(layerSel, v=>{ bookOpen.value=[...v]; });

    const cmpKeys = computed(()=>Object.keys(D.fieldMatrix).filter(k=>Object.keys(D.fieldMatrix[k]).length>=1));
    const cmpDataC = computed(()=>cmpData(cmpLayer.value));
    const cmpBooks = computed(()=>cmpDataC.value.books);
    const cmpKnownIds = computed(()=>cmpDataC.value.known);
    const cmpKnown = computed(()=>cmpDataC.value.known.length);
    const cmpMajority = computed(()=>cmpDataC.value.majority);
    const cmpRows = computed(()=>cmpDataC.value.fields.map(f=>({field:f, heat:cmpDataC.value.heat[f], common:cmpDataC.value.heat[f]>=cmpDataC.value.majority})));
    const uniqOf = id => (cmpDataC.value.m[id]||[]).filter(f=>cmpDataC.value.heat[f]===1);
    const missOf = id => cmpDataC.value.fields.filter(f=>cmpDataC.value.heat[f]===cmpDataC.value.known.length && !(cmpDataC.value.m[id]||[]).includes(f));
    const cmpSummary = computed(()=>cmpKnownIds.value.map(id=>({id,title:bookOf(id).title,uniq:uniqOf(id),miss:missOf(id)})));
    function cmpBookJson(id){
      const rec={}; (cmpDataC.value.m[id]||[]).forEach(f=>rec[f]="");
      return hlJson({ layer:cmpLayer.value, 书名:bookOf(id).title, record:Object.keys(rec).length?rec:"（未采集）",
        偏移独有:uniqOf(id).length?uniqOf(id):"无", 缺失共性:missOf(id) });
    }
    function stepDesc(b,i){
      const g=GV[b.id], parts=[];
      const ms=b.id&&GT[b.id]&&GT[b.id][i]; if(ms) parts.push(dObj(ms).t);
      if(g&&g.total){ if(i===2) parts.push('装填 '+g.fill+'/'+g.total+' 卷'); if(i===3&&g.pack!=null) parts.push('打包 '+g.pack+'/'+g.total+' 卷'); }
      return parts.join(' · ') || '未执行';
    }
    function volText(b){
      const g=GV[b.id]; if(!g||!g.total) return '';
      let s='共 '+g.total+' 卷 · 装填已到 '+g.fill+' 卷 · '+(g.pack==null?'打包不分卷（成品按部门聚合）':'打包已到 '+g.pack+' 卷');
      if(g.note) s+='　'+g.note;
      return s;
    }
    const tlQ=ref(''), tlStages=ref([0,1,2,3,4,5,6]);
    const tlMode=ref('chart'), tlBook=ref(''), tlChart=ref(null);
    let tlInst=null;
    // 与书目/详情共用同一数据源：GTIMES 阶段时间戳 → 事件流
    function tlEvents(){
      const evs=[];
      Object.keys(GT).forEach(id=>{ const b=bookOf(id); if(!b.title) return;
        (GT[id]||[]).forEach((ms,s)=>{ if(ms==null||!tlStages.value.includes(s)) return;
          evs.push({id,s,ms,t:dObj(ms).t,title:b.title}); }); });
      return evs;
    }
    const tlChartBooks=computed(()=>{ const ids=new Set(tlEvents().map(e=>e.id));
      return D.books.filter(b=>ids.has(b.id)); });
    function renderTlChart(){
      if(tab.value!=='timeline'||tlMode.value==='dom') return;
      const el=tlChart.value; if(!el||!window.echarts) return;
      if(!tlInst||tlInst.dom!==el){ if(tlInst&&!tlInst.isDisposed()) tlInst.dispose(); tlInst=window.echarts.init(el); }
      let evs=tlEvents();
      if(tlMode.value==='one'){
        if(!tlBook.value&&tlChartBooks.value.length) tlBook.value=tlChartBooks.value[0].id;
        evs=evs.filter(e=>e.id===tlBook.value);
      }
      const ids=[...new Set(evs.map(e=>e.id))];
      const names=ids.map(id=>'《'+bookOf(id).title+'》');
      const series=D.stages.map((nm,s)=>({
        name:nm, type:'scatter', symbolSize:tlMode.value==='one'?17:13,
        itemStyle:{color:STAGEC[s], borderColor:'#fffdf7', borderWidth:1.5},
        data:evs.filter(e=>e.s===s).map(e=>({value:[e.ms, ids.indexOf(e.id)], t:e.t, title:e.title}))
      }));
      tlInst.setOption({
        animation:false,
        grid:{left:140,right:40,top:52,bottom:74},
        legend:{top:4,data:D.stages,textStyle:{fontSize:12}},
        tooltip:{formatter:p=>'《'+p.data.title+'》 <b>'+p.seriesName+'</b><br>'+p.data.t},
        xAxis:{type:'time',splitLine:{show:true,lineStyle:{color:'#efe6d3'}},
          axisLabel:{hideOverlap:true,formatter:{year:'{yyyy}',month:'{MM}-{dd}',day:'{MM}-{dd}',hour:'{HH}:{mm}',minute:'{HH}:{mm}',second:'{HH}:{mm}'}}},
        yAxis:{type:'category',data:names,inverse:true,axisLabel:{fontSize:12},splitLine:{show:true,lineStyle:{color:'#efe6d3'}}},
        dataZoom:[{type:'slider',xAxisIndex:0,height:24,bottom:12},{type:'inside',xAxisIndex:0}],
        series
      },true);
      tlInst.resize();
    }
    watch([tab,tlMode,tlStages,tlBook], ()=>{ if(tab.value==='timeline'&&tlMode.value!=='dom') nextTick(renderTlChart); });
    window.addEventListener('resize', ()=>{ if(tlInst&&!tlInst.isDisposed()) tlInst.resize(); });
    const tlDays=computed(()=>{
      const kw=tlQ.value.trim(); const byDay={};
      Object.keys(GT).forEach(id=>{ const b=bookOf(id); if(!b.title) return;
        if(kw && !(b.title+b.dir).includes(kw)) return;
        (GT[id]||[]).forEach((ms,s)=>{ if(ms==null||!tlStages.value.includes(s)) return;
          const o=dObj(ms); (byDay[o.date]=byDay[o.date]||[]).push({id,s,h:o.h,t:o.t}); }); });
      return Object.keys(byDay).sort().map(date=>{
        const evs=byDay[date];
        let h0=Math.floor(Math.min(...evs.map(e=>e.h))), h1=Math.ceil(Math.max(...evs.map(e=>e.h)));
        if(h1-h0<3) h1=h0+3;
        const lanes=[], seen={};
        evs.slice().sort((a,b)=>a.id<b.id?-1:1).forEach(e=>{ if(seen[e.id]==null){seen[e.id]=lanes.length;lanes.push({id:e.id,evs:[]});} lanes[seen[e.id]].evs.push({s:e.s,h:e.h,t:e.t}); });
        const hours=[]; for(let h=h0;h<=h1;h++)hours.push(h);
        return {date,cnt:evs.length,h0,h1,hours,lanes};
      });
    });
    const tlPos=(h,dy)=>((h-dy.h0)/(dy.h1-dy.h0)*100).toFixed(2)+'%';

    function openBook(b){ cur.value=b; tab.value="book"; }
    // 当前流程节点：状态推导与 stages.js 数据结构同源
    const curFlow = computed(()=>{
      const b=cur.value; if(!b.id||!b.stageStates) return null;
      let ci=-1, st=0; b.stageStates.forEach((s,i)=>{ if(s>0){ci=i;st=s;} });
      if(ci<0) return {name:"未开工", state:0, mark:"尚无任何阶段产出（原料也未入库）", next:GS.length?("先做「"+GS[0].name+"」："+GS[0].goal):"—"};
      const g=GS[ci]||{name:D.stages[ci],mark:"",next:""};
      const next = st===1 ? ("本阶段进行中，先做完："+g.next)
        : (ci+1<GS.length ? ("本阶段已完成 ✓，进入「"+GS[ci+1].name+"」："+GS[ci+1].goal) : "全流程已交付，后续以版本增量维护");
      return {name:g.name, state:st, mark:g.mark, next};
    });
    function flowRows(b){
      return GS.map((g,i)=>{
        const stv=(b.stageStates&&b.stageStates[i])||0;
        const ms=b.id&&GT[b.id]?GT[b.id][i]:null;
        let next;
        if(stv===2) next = i+1<GS.length ? ("→ "+GS[i+1].name+"："+GS[i+1].goal) : "交付完成，维护版本增量即可";
        else if(stv===1) next = g.next;
        else next = "待前序阶段完成后进入本步："+g.goal;
        return {i, name:g.name, goal:g.goal, mark:g.mark, st:stv===2?"完成":stv===1?"进行中":"未开始",
          next, time: ms!=null?dObj(ms).t:"—"};
      });
    }
    function stepStatus(i){ const s=cur.value.stageStates&&cur.value.stageStates[i]; return s===2?"success":s===1?"process":"wait"; }
    function bookOf(id){ return D.books.find(x=>x.id===id)||{}; }
    function pickLayer(L){ selLayerKey.value=L.key; openAllJson.value=false; }
    function cmpCellCls(bid,row){
      const cd=cmpDataC.value; const m=cd.m[bid];
      if(!m) return "muted";
      const has=m.includes(row.field);
      if(has && cd.heat[row.field]===1) return "unqdot";
      if(has) return "okdot";
      return cd.heat[row.field]>=cd.majority?"nodot":"";
    }
    function cmpMark(bid,row){
      const cd=cmpDataC.value; const m=cd.m[bid];
      if(!m) return "—";
      const has=m.includes(row.field);
      return has?"✓":(cd.heat[row.field]>=cd.majority?"✗":"");
    }

    const qs=new URLSearchParams(location.search);
    if(qs.get("tab")) tab.value=qs.get("tab");
    if(qs.get("layer")&&D.fieldMatrix[qs.get("layer")]){ cmpLayer.value=qs.get("layer"); selLayerKey.value=qs.get("layer"); }
    if(qs.get("id")){ const b=D.books.find(x=>x.id===qs.get("id")); if(b) openBook(b); }

    return {D,tab,q,fStatus,fStage,filteredBooks,stTag,stTxt2,openBook,cur,stepStatus,stepDesc,volText,curFlow,flowRows,GS,
      layerQ,navGroups,selLayer,pickLayer,bookOpen,layerSel,openAllJson,layerJson,bookLayerJson,
      allLayerKeys,totalPairs:Object.values(layerBooks).reduce((s,v)=>s+v.length,0),
      cmpLayer,cmpOnly,cmpAnnot,cmpOpen,cmpSwitch,cmpKeys,cmpBooks,cmpKnownIds,cmpKnown,cmpMajority,
      cmpRows,cmpSummary,cmpBookJson,cmpCellCls,cmpMark,uniqOf,missOf,bookOf,fDesc,
      tlQ,tlStages,tlDays,tlPos,STAGEC,tlMode,tlBook,tlChart,tlChartBooks};
  }
}).use(ElementPlus).mount("#app");
</script>
</body>
</html>
